<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Reasongraph — context, reasoning and decision provenance">
  <title>Reasongraph</title>
  <desc>A living knowledge graph over a soft dawn sky: trace pulses travel each spoke into the hub.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"  stop-color="#5FB7CE"/>
      <stop offset="55%" stop-color="#79C3CE"/>
      <stop offset="100%" stop-color="#AFD9DA"/>
    </linearGradient>
    <radialGradient id="peach" cx="12%" cy="100%" r="85%">
      <stop offset="0%"  stop-color="#F6D9B4" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#EFE0CB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EFE0CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="88%" cy="6%" r="55%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloud" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#FDFCFA" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#F4F1EC" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F4F1EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudWarm" cx="50%" cy="60%" r="55%">
      <stop offset="0%"  stop-color="#F4FBFB" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E9F3F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E9F3F0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7FD0C4"/>
      <stop offset="55%"  stop-color="#3FB2A6"/>
      <stop offset="100%" stop-color="#2E9187"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="puff" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2A4368" flood-opacity="0.38"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/></filter>

    <mask id="wordMask">
      <rect x="0" y="0" width="1200" height="340" fill="#000"/>
      <text x="600" y="266" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="84" font-weight="700" letter-spacing="-2.5" fill="#fff">Reasongraph</text>
    </mask>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>

    <style>
      @keyframes hubBeat  { 0%,100%{ transform:scale(1);    opacity:.10 } 50%{ transform:scale(1.24); opacity:.20 } }
      @keyframes hubRing  { 0%,100%{ transform:scale(1);    opacity:.16 } 50%{ transform:scale(1.10); opacity:.26 } }
      @keyframes hubCore  { 0%,100%{ opacity:.9 } 50%{ opacity:1 } }
      @keyframes breathe  { 0%,100%{ opacity:.82 } 50%{ opacity:1 } }
      @keyframes cloudA   { 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(40px,-6px) } }
      @keyframes cloudB   { 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(-34px,5px) } }
      @keyframes cloudC   { 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(26px,7px) } }
      @keyframes sheenX   { 0%,66%,100%{ transform:translateX(-560px) } 84%{ transform:translateX(560px) } }
      @keyframes tp1 { 0%{transform:translate(-95px,-52px);opacity:0} 10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }
      @keyframes tp2 { 0%{transform:translate(68px,-62px);opacity:0}  10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }
      @keyframes tp3 { 0%{transform:translate(135px,2px);opacity:0}   10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }
      @keyframes tp4 { 0%{transform:translate(90px,58px);opacity:0}   10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }
      @keyframes tp5 { 0%{transform:translate(-44px,66px);opacity:0}  10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }
      @keyframes tp6 { 0%{transform:translate(-132px,16px);opacity:0} 10%{opacity:1} 78%{opacity:1} 100%{transform:translate(0,0);opacity:0} }

      .hbeat{ transform-origin:600px 110px; animation:hubBeat 2.6s ease-in-out infinite }
      .hring{ transform-origin:600px 110px; animation:hubRing 2.6s ease-in-out infinite }
      .hcore{ animation:hubCore 2.6s ease-in-out infinite }
      .cA{ animation:cloudA 26s ease-in-out infinite }
      .cB{ animation:cloudB 32s ease-in-out infinite }
      .cC{ animation:cloudC 38s ease-in-out infinite }
      .sat{ animation:breathe 4.4s ease-in-out infinite }
      .s2{animation-delay:.5s}.s3{animation-delay:1s}.s4{animation-delay:1.5s}.s5{animation-delay:2s}.s6{animation-delay:2.6s}
      .sheenG{ animation:sheenX 7s ease-in-out infinite }
      .tp{ animation-duration:2.6s; animation-timing-function:ease-in; animation-iteration-count:infinite }
      .t1{animation-name:tp1;animation-delay:0s}.t2{animation-name:tp2;animation-delay:.9s}.t3{animation-name:tp3;animation-delay:1.5s}
      .t4{animation-name:tp4;animation-delay:.4s}.t5{animation-name:tp5;animation-delay:1.9s}.t6{animation-name:tp6;animation-delay:1.1s}

      @media (prefers-reduced-motion: reduce) {
        .hbeat,.hring,.hcore,.cA,.cB,.cC,.sat,.sheenG,.tp { animation: none !important }
        .sat{ opacity:.95 } .tp{ opacity:0 !important }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#sky)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#sun)"/>

    <!-- cloud masses -->
    <g filter="url(#puff)">
      <g class="cA" fill="url(#cloud)">
        <ellipse cx="250" cy="70"  rx="240" ry="70"/>
        <ellipse cx="430" cy="52"  rx="170" ry="52"/>
      </g>
      <g class="cB" fill="url(#cloud)">
        <ellipse cx="980" cy="90"  rx="230" ry="66"/>
        <ellipse cx="1120" cy="70" rx="150" ry="48"/>
      </g>
      <g class="cC" fill="url(#cloudWarm)">
        <ellipse cx="180" cy="300" rx="280" ry="90"/>
        <ellipse cx="470" cy="330" rx="240" ry="80"/>
      </g>
      <g class="cA" fill="url(#cloud)"><ellipse cx="760" cy="315" rx="240" ry="74"/></g>
    </g>

    <rect x="0" y="0" width="1200" height="340" fill="url(#peach)"/>
    <rect x="0" y="0" width="1200" height="340" fill="#FFFFFF" opacity="0.03" filter="url(#grain)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- knowledge-graph motif -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#2E6E77" stroke-width="1.8" opacity="0.55">
        <line x1="600" y1="110" x2="505" y2="58"/><line x1="600" y1="110" x2="668" y2="48"/>
        <line x1="600" y1="110" x2="735" y2="112"/><line x1="600" y1="110" x2="690" y2="168"/>
        <line x1="600" y1="110" x2="556" y2="176"/><line x1="600" y1="110" x2="468" y2="126"/>
      </g>
      <g stroke="#255A62" stroke-width="1.4" opacity="0.4">
        <line x1="505" y1="58" x2="668" y2="48"/><line x1="668" y1="48" x2="735" y2="112"/>
        <line x1="735" y1="112" x2="690" y2="168"/><line x1="690" y1="168" x2="556" y2="176"/>
        <line x1="556" y1="176" x2="468" y2="126"/>
      </g>
      <g stroke="#255A62" stroke-width="1.2" opacity="0.3">
        <line x1="735" y1="112" x2="762" y2="66"/><line x1="468" y1="126" x2="452" y2="182"/>
      </g>
    </g>

    <!-- trace pulses -->
    <g fill="#FFFFFF" filter="url(#glow)">
      <g transform="translate(600,110)"><circle class="tp t1" r="3" opacity="0"/></g>
      <g transform="translate(600,110)"><circle class="tp t2" r="3" opacity="0"/></g>
      <g transform="translate(600,110)"><circle class="tp t3" r="3" opacity="0"/></g>
      <g transform="translate(600,110)"><circle class="tp t4" r="3" opacity="0"/></g>
      <g transform="translate(600,110)"><circle class="tp t5" r="3" opacity="0"/></g>
      <g transform="translate(600,110)"><circle class="tp t6" r="3" opacity="0"/></g>
    </g>

    <!-- hub -->
    <circle class="hbeat" cx="600" cy="110" r="36" fill="#3FB2A6" opacity="0.14"/>
    <circle class="hring" cx="600" cy="110" r="22" fill="#3FB2A6" opacity="0.20"/>
    <circle cx="600" cy="110" r="15" fill="url(#accent)"/>
    <circle cx="600" cy="110" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.75"/>
    <circle class="hcore" cx="600" cy="110" r="5" fill="#F1FBFA"/>

    <!-- satellites -->
    <g fill="#FBFEFE" stroke-width="2.4">
      <circle class="sat s1" cx="505" cy="58"  r="8"   stroke="#255A62"/>
      <circle class="sat s2" cx="668" cy="48"  r="10"  stroke="#3FB2A6"/>
      <circle class="sat s3" cx="735" cy="112" r="7"   stroke="#255A62"/>
      <circle class="sat s4" cx="690" cy="168" r="8.5" stroke="#3FA6B0"/>
      <circle class="sat s5" cx="556" cy="176" r="7"   stroke="#3FB2A6"/>
      <circle class="sat s6" cx="468" cy="126" r="8"   stroke="#255A62"/>
    </g>
    <g fill="#FFFFFF" opacity="0.85"><circle cx="762" cy="66" r="4.5"/><circle cx="452" cy="182" r="4.5"/></g>

    <!-- wordmark -->
    <g filter="url(#wordShadow)">
      <text x="600" y="266" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="84" font-weight="700" letter-spacing="-2.5" fill="#FFFFFF">Reasongraph</text>
    </g>
    <g mask="url(#wordMask)"><g class="sheenG"><rect x="360" y="200" width="480" height="84" fill="url(#sheen)"/></g></g>

    <!-- tagline -->
    <text x="600" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#245C61" fill-opacity="0.92">CONTEXT · REASONING · DECISION PROVENANCE</text>
  </g>
</svg>
