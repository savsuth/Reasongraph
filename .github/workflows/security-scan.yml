name: Security Scan

on:
  schedule:
    - cron: '30 1 * * 1,4'  # Mon/Thu 7 AM IST
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '**/*.md'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      # Needed for the "Comment PR with Security Results" step below. Safe on
      # pull_request (not pull_request_target): GitHub always forces a
      # read-only token for PRs from forks regardless of this permission.
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the pinned dependency set FIRST so the audit sees
          # Reasongraph's exact CI/release dependency tree (requirements-ci.txt
          # is generated from pyproject.toml extras, so this covers the real deps).
          pip install -r requirements-ci.txt
          # Tooling AFTER the pinned set so the pinned requirements win any
          # transitive-dep conflicts with the tools.
          pip install pip-audit bandit semgrep jq

      - name: Run pip-audit (Package Vulnerabilities)
        # Gate on findings for dependency-touching PRs; stay non-blocking on the
        # scheduled / push runs (same policy as security.yml's audit job) until a
        # full pass over any pre-existing findings across the [all] tree is done.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          # pip-audit (PyPA) queries the Python Packaging Advisory Database and
          # OSV with no account or API key — Safety 3.x now refuses to run
          # without authentication, which broke this job on every scheduled run.
          # Matches the tool already used by security.yml's `audit` job.
          pip-audit -r requirements-ci.txt --format json --output pip-audit-report.json --progress-spinner off || true

          # Guard 1: fail loudly if pip-audit exited before writing a report at
          # all (network error, tool crash) rather than treating it as a clean scan.
          if [ ! -s pip-audit-report.json ]; then
            echo "::error::pip-audit produced no report (pip-audit-report.json missing or empty). Check for network errors or a pip-audit crash above."
            exit 1
          fi

          echo "Checking for package vulnerabilities..."

          # Guard 2: VULNS must be a non-negative integer before the -gt test;
          # "" (jq parse failure) or "null" would otherwise throw and fall
          # through to the success branch.
          VULNS=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit-report.json 2>/dev/null)
          if ! [[ "$VULNS" =~ ^[0-9]+$ ]]; then
            echo "::error::pip-audit report exists but the vuln count is non-numeric (got: '${VULNS}'). The report may be malformed."
            exit 1
          fi

          if [ "$VULNS" -gt 0 ]; then
            echo "❌ Security vulnerabilities found: $VULNS"
            echo "(blocks dependency-touching PRs; informational on scheduled/push runs)"
            echo ""
            echo "Vulnerability details:"
            jq -r '.dependencies[] | select(.vulns | length > 0) | .name as $n | .version as $v | .vulns[] | "- \($n)==\($v): \(.id) (fix: \((.fix_versions // []) | join(", ") // "none"))"' pip-audit-report.json || true
            exit 1
          else
            echo "✅ No security vulnerabilities found"
          fi
        
      - name: Run Bandit (Code Security Linter)
        run: |
          bandit -r reasongraph/ -f json -o bandit-report.json || true
          echo "Checking for HIGH severity security issues..."
          
          # Count HIGH severity issues
          HIGH_ISSUES=$(bandit -r reasongraph/ -f json -ll 2>/dev/null | jq -r '.results[]? | select(.issue_severity == "HIGH") | .test_name' 2>/dev/null | wc -l || echo "0")
          
          if [ "$HIGH_ISSUES" -gt 0 ]; then
            echo "❌ HIGH severity security issues found: $HIGH_ISSUES"
            echo "CI will fail to prevent merging of high-risk code"
            echo ""
            echo "High severity issues:"
            bandit -r reasongraph/ -ll | grep "Severity: High" -A 5 -B 1 || true
            exit 1
          else
            echo "✅ No HIGH severity security issues found"
          fi
        
      - name: Run Semgrep (Static Analysis)
        run: |
          echo "Running Semgrep static analysis..."
          semgrep --config=auto --json --output=semgrep-report.json reasongraph/ || true
          
          # Run security-focused rules
          echo "Checking for security patterns..."
          SECURITY_ISSUES=$(semgrep --config=p/security --json reasongraph/ 2>/dev/null | jq '.results | length' 2>/dev/null || echo "0")
          
          if [ "$SECURITY_ISSUES" -gt 0 ]; then
            echo "⚠️ Security patterns found: $SECURITY_ISSUES"
            echo "Review these findings for potential improvements"
            semgrep --config=p/security reasongraph/ || true
          else
            echo "✅ No security patterns found"
          fi
        
      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports
          retention-days: 14
          path: |
            pip-audit-report.json
            bandit-report.json
            semgrep-report.json
        
      - name: Comment PR with Security Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // Renders one tool's findings as a section. `items` is already
            // the list of pre-formatted "- `thing` in `where`" strings; this
            // just handles the found/not-found/report-missing framing and
            // collapses long lists into a <details> block so the comment
            // doesn't turn into a wall of text.
            function renderSection(title, reportPath, parse) {
              let data;
              try {
                data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              } catch (e) {
                return [
                  `### ${title}`,
                  `⚠️ No report found at \`${reportPath}\` — the scan may have failed before producing output. Check the job logs.`,
                ].join('\n');
              }

              const items = parse(data);
              if (items.length === 0) {
                return [`### ${title}`, `✅ No findings.`].join('\n');
              }

              const lines = [`### ${title}`, `Found **${items.length}**.`, ''];
              const shown = items.slice(0, 15);
              if (items.length > 15) {
                lines.push('<details>', '<summary>Show all findings</summary>', '');
                lines.push(...items);
                lines.push('', '</details>');
              } else {
                lines.push(...shown);
              }
              return lines.join('\n');
            }

            const depAuditSection = renderSection(
              'pip-audit — dependency vulnerabilities',
              'pip-audit-report.json',
              (data) => (data.dependencies || []).flatMap(
                (d) => (d.vulns || []).map(
                  (v) => `- \`${d.name}==${d.version}\`: ${v.id}` +
                    (v.aliases && v.aliases.length ? ` (${v.aliases.join(', ')})` : '') +
                    ` — fix: ${(v.fix_versions && v.fix_versions.length) ? v.fix_versions.join(', ') : 'none'}`
                )
              )
            );

            const banditSection = renderSection(
              'Bandit — HIGH-severity code issues',
              'bandit-report.json',
              (data) => (data.results || [])
                .filter((issue) => issue.issue_severity === 'HIGH')
                .map((issue) => `- \`${issue.test_name}\` in \`${issue.filename}:${issue.line_number}\``)
            );

            const semgrepSection = renderSection(
              'Semgrep — static analysis patterns',
              'semgrep-report.json',
              (data) => (data.results || []).map(
                (issue) => `- \`${issue.check_id}\` in \`${issue.path}:${issue.start?.line ?? '?'}\``
              )
            );

            const comment = [
              '# 🔒 Security Scan Results',
              '',
              depAuditSection,
              '',
              banditSection,
              '',
              semgrepSection,
              '',
              '---',
              '',
              '*This security scan runs automatically on source-code PRs and bi-weekly (skipped for doc/markdown-only changes).*',
              '',
              '📊 **Security Policy**: CI fails on Safety vulnerabilities and Bandit HIGH-severity findings. Semgrep findings above are informational and do not block merge.',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
              console.log('✅ Security comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post security comment:', error.message);
              console.log('📋 Security scan results saved to artifacts');
            }
